# Limitation: Sigma has no XML parsing, so path, extension, arguments and trigger
# are all matched against the single TaskContent field (the raw task-definition
# XML). The SPL/KQL ports parse the XML out into per-action fields and match
# those instead - treat this file as the portable base, not the sharpest
# version of the rule.
#
# NB (chainsaw gotcha): no runs of 3+ dashes '---' inside comments in this file.
# Chainsaw's Sigma loader treats a dash-run as a YAML document separator and
# silently drops the rule ("No valid detection rules were found"). The '===='
# separators below are safe; '----' is not.

title: Scheduled Task Creation
id: b7e6a2c1-4f3d-4c8a-9e2b-1a5d6f7c8e90
status: Stable
description: |
  Detects suspicious scheduled task creation via Windows Security Event ID 4698.
  Adversaries commonly use scheduled tasks for persistence and privilege escalation (T1053.005).
  Everything below is matched against the single TaskContent field, which holds the task-definition XML.
  Three signal categories are used:
  1. WHERE it runs   - the task executes from a world-writable / staging folder (location) or runs a scripting-engine file type (extension). Two selections.
  2. HOW it runs      - the action carries LOLBin interpreter flags used to force-run, hide, or obfuscate script execution.
  3. PRIVILEGE x TRIGGER - the task both auto-starts (boot/logon) AND runs elevated/SYSTEM. Neither is damning alone; together it is worth investigating (combinational).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: William Richardson
date: 2026-07-06
modified: 2026-07-07
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  product: windows
  service: security
level: medium
detection:
  selection_event:
    EventID: 4698

  # ==== Category 1 - WHERE the task runs ================================
  # 1a. Location: world-writable / staging folders attackers stage payloads in.
  selection_susp_path:
    TaskContent|contains:
      - '\Users\Public\'
      - '\AppData\Local\Temp\'
      - '\AppData\Roaming\'
      - '\ProgramData\'
      - '\Windows\Temp\'
      - '\PerfLogs\'
      - '\Downloads\'
  # 1b. File type: scripting-engine extensions. Anchored with the closing '<'
  #     of the <Command> tag so we match the executable being run, not the same
  #     extension mentioned inside an argument string.
  selection_susp_ext:
    TaskContent|contains:
      - '.ps1</Command>'
      - '.vbs</Command>'
      - '.js</Command>'
      - '.jse</Command>'
      - '.wsf</Command>'
      - '.hta</Command>'
      - '.bat</Command>'
      - '.cmd</Command>'
      - '.scr</Command>'

  # ==== Category 2 - HOW it runs (LOLBin arguments) ====================
  # Interpreter flags/patterns that force script execution, hide the window, or
  # obfuscate. These live inside <Command> or <Arguments> in the XML.
  # NOTE: bare 'powershell' is deliberately NOT here - far too common to fire on.
  selection_susp_args:
    TaskContent|contains:
      - '-noni'                # -NonInteractive
      - '-w hidden'            # -WindowStyle Hidden
      - '-windowstyle hidden'
      - 'bypass'               # -ExecutionPolicy Bypass / -ep bypass / -exec bypass
      - '-enc'                 # -EncodedCommand
      - 'frombase64string'
      - 'iex('                 # anchored so we don't match iexplore.exe
      - ' iex '
      - 'invoke-expression'
      - 'downloadstring'
      - 'downloadfile'
      - 'mshta'
      - 'rundll32'
      - 'regsvr32'

  # ==== Category 3 - PRIVILEGE x TRIGGER (combinational) ===============
  # Elevation alone is normal for admin tasks; boot/logon triggers alone are
  # normal for legit persistence-by-design software. ANDed together in the
  # condition = auto-starting AND elevated -> medium-severity, worth a look.
  selection_elevation:
    TaskContent|contains:
      - 'HighestAvailable'     # <RunLevel>HighestAvailable</RunLevel>
      - 'S-1-5-18'             # runs as SYSTEM (well-known SID)
      - '<UserId>SYSTEM'
      - '<UserId>LocalSystem'
  selection_trigger:
    TaskContent|contains:
      - '<BootTrigger'         # fires at system startup
      - '<LogonTrigger'        # fires at user logon

  condition: selection_event and ((selection_susp_path or selection_susp_ext) or selection_susp_args or (selection_elevation and selection_trigger))


